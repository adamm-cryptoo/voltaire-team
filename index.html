<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | Our Football Team</title>
  <meta name="description" content="Official page of our school grade football team: matches, players and our field.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/svsphoto.jpg">
</head>

<body data-page="home">

  <header id="site-header"></header>
  <div class="hero">
    <div class="container">
      <h1 id="hero-title"></h1>
      <p id="hero-motto"></p>
      <div class="btn-row">
        <a class="btn btn-gold" id="hero-challenge" href="#" target="_blank" rel="noopener"> Challenge us</a>
        <a class="btn btn-outline" href="matches.html">See matches</a>
      </div>
    </div>
  </div>

  <main class="container">

    <section>
      <h2>Next match</h2>
      <div id="next-match"></div>

    <section>
      <h2>Latest results</h2>
      <div class="grid" id="recent-results"></div>
    </section>

    <section>
      <h2>Our season</h2>
      <div class="stats" id="stats"></div>

    <section>
      <h2>About us</h2>
      <p class="lead" id="about-text"></p>

    <section>
      <h2>Explore</h2>
      <div class="quick">
        <a href="matches.html"><span class="icon">📅</span><strong>Matches</strong><span class="desc">Upcoming games and

        <a href="team.html"><span class="icon">👕</span><strong>Team</strong><span class="desc">Players, numbers and
            positions</span></a>
        <a href="field.html"><span class="icon">🏟️</span><strong>Field</strong><span class="desc">Where we play and
