<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matches | Our Football Team</title>
  <link rel="stylesheet" href="css/style.css">
   <link rel="icon" href="images/svsphoto.jpg">
</head>
<body data-page="matches">

  <header id="site-header"></header>

  <div class="hero page-hero">
    <div class="container">
      <h1>Matches</h1>
      <p>Upcoming games and past results</p>
    </div>
  </div>

  <main class="container">

    <section>
      <h2>Upcoming matches</h2>
      <div class="grid" id="upcoming-list"></div>
    </section>

    <section>
      <h2>Results</h2>
      <div class="grid" id="past-list"></div>
    </section>

    <section>
      <h2>Want to play us?</h2>
      <div class="card">
        <p class="lead" style="margin-bottom:16px">
          Send us your information on the whatsapp number below
        </p>
        <a class="btn btn-green" id="challenge-btn" href="#" target="_blank" rel="noopener">💬 Message us on WhatsApp</a>
      </div>
    </section>

  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
